<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>악몽 방송·음향 세팅 포트폴리오</title>
<style>html,body{margin:0;background:transparent;color-scheme:normal}body{font-family:Arial,sans-serif}</style>
</head>
<body>
<p id="loading" role="status">포트폴리오를 불러오는 중입니다.</p>
<noscript>포트폴리오를 보려면 JavaScript를 활성화해 주세요.</noscript>
<script>
(async()=>{
  try{
    const response=await fetch('./index.html');
    if(!response.ok)throw new Error('Portfolio unavailable');
    const source=await response.text();
    // Artmug's embedded presentation must not link visitors to ConnectLabs.
    const portfolio=new DOMParser().parseFromString(source,'text/html');
    for(const anchor of portfolio.querySelectorAll('a[href]')){
      const href=anchor.getAttribute('href')||'';
      if(href.startsWith('#'))continue;
      let target;
      try{target=new URL(href,location.href);}catch{continue;}
      const host=target.hostname.toLowerCase();
      const isConnectLabs=host==='connectlabs.kr'||host.endsWith('.connectlabs.kr')||
        host==='connenctlabs.kr'||host.endsWith('.connenctlabs.kr')||
        host==='connectlabs-sound-portfolio.connectlabs-1.chatgpt.site'||
        (host==='n-ightmar-e.github.io'&&target.pathname.startsWith('/connectlabs-sound-portfolio'));
      if(isConnectLabs)anchor.remove();
    }
    for(const note of portfolio.querySelectorAll('.portfolio-footnote')){
      if(!note.textContent.trim())note.remove();
    }
    // Prevent the 12px scroll-entry animation in Artmug; keep button/form feedback.
    portfolio.documentElement.setAttribute('data-artmug-static-scroll','');
    for(const script of portfolio.querySelectorAll('script:not([src])')){
      const entryGuard="if('IntersectionObserver' in window){";
      if(script.textContent.includes(entryGuard)){
        script.textContent=script.textContent.replace(entryGuard,
          "if('IntersectionObserver' in window && !document.documentElement.hasAttribute('data-artmug-static-scroll')){");
      }
    }
    const embeddedSource='<!doctype html>'+portfolio.documentElement.outerHTML;
    // Only this embedded view has a transparent canvas; the main page stays unchanged.
    const override='<style id="artmug-transparent-canvas">html,body{background:transparent!important}html{color-scheme:light!important}</style>';
    if(!source.includes('</head>'))throw new Error('Invalid portfolio document');
    document.open();
    document.write(embeddedSource.replace('</head>',override+'</head>'));
    document.close();
  }catch{
    document.getElementById('loading').textContent='포트폴리오를 불러오지 못했습니다. 페이지를 새로고침해 주세요.';
  }
})();
</script>
</body>
</html>
